[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=VRRealms Creator Kit

; IMPORTANT: Do NOT add a +DirectoriesToNeverCook entry for
; /Game/VRRealms/Community here. In the SHIPPING game that exclusion keeps the
; client/server paks clean — but in this kit the whole point is to cook that
; subtree into a Workshop pak. The WorkshopTool already strips NeverCook per-cook,
; so leaving it unset here keeps things simple and correct.

[/Script/UnrealEd.ProjectPackagingSettings]
; CRITICAL for Workshop content: disable shared material shader code so each
; material's compiled shaders are embedded in its cooked asset (and therefore ship
; INSIDE the focused .pak). Left at UE's default (True), shaders go into a separate
; shared shader library that the Workshop pak does NOT contain — materials then
; render as the grey checkerboard default in game, even though the pak has every
; mesh and texture. Mirrors the shipping game's DefaultGame.ini.
bShareMaterialShaderCode=False
bSharedMaterialNativeLibraries=False
