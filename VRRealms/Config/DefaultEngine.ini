[/Script/Engine.RendererSettings] block below is a VERBATIM MIRROR of the
;  shipping VR Realms game. It MUST match so that materials/shaders cooked into a
;  Workshop .pak render correctly when that pak is mounted in the real game.
;  Do NOT change these values — forward shading + MSAA + instanced stereo + baked
;  lighting are load-bearing for visual parity.
; ============================================================================

[/Script/Engine.RendererSettings]
r.Nanite=0
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
vr.InstancedStereo=True
r.SeparateTranslucency=0
r.HZBOcclusion=0
r.EyeAdaptionQuality=0
r.SSR.MaxRoughness=0
r.rhicmdbypass=0
r.TiledReflectionEnvironmentMinimumCount=10
r.ForwardShading=True
r.DefaultFeature.AntiAliasing=3
r.AllowStaticLighting=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AutoExposure=False
r.CustomDepth=3
r.CustomDepthTemporalAAJitter=True
r.EarlyZPass=3
r.EarlyZPassMovable=True
r.GBufferFormat=1
r.Mobile.UseHWsRGBEncoding=True
r.MobileMSAA=4
r.MobileHDR=False
r.AntiAliasingMethod=3
r.Mobile.AntiAliasing=3
vr.VRS.HMDFixedFoveationDynamic=False
vr.VRS.HMDFixedFoveationLevel=0
vr.MobileMultiView=True

; NOTE: This project deliberately does NOT set GlobalDefaultGameMode,
; LocalPlayerClassName, or any /Game/VRE/... or /Script/VRRealms... class.
; Creators never touch the player pawn or game logic — the real game supplies
; those at runtime. The WorkshopTool's cook also forces engine-default GameMode
; and LocalPlayer, so leave these unset.

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; CRITICAL: must match the shipping game's shader model. The game runs PCD3D_SM5
; (forward + MSAA + instanced-stereo VR). Without this line the kit cooks UE 5.7's
; default (SM6), and the SM5 game can't use those shaders — every material falls
; back to the grey checkerboard default even though the pak contains everything.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM5

